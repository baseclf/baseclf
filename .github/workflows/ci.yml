name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The boundary between what ships publicly and what does not.
      # Runs first: a leaked secret is worse than a failing test.
      - name: Guard
        run: node scripts/guard-commit.mjs --all

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs in workerd with a real D1 binding, not a Node emulation.
      - name: Test
        run: npm test

      # `build:cli` runs the Worker build first, then builds both binaries and runs
      # each one. Publishing is a real workflow now, so what CI checks is what gets
      # published rather than only what compiles.
      - name: Build
        run: npm run build:cli

      # The tarball, not the working tree. The first publish attempt shipped neither
      # a Worker nor a usable bin field, and nothing in this file would have noticed:
      # both were correct on disk and wrong in the package.
      - name: Package
        run: npm run check:package
