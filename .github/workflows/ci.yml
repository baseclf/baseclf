name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v4 runs on Node 20, which the runner now warns is on its way out. v7 is
      # the current major for both; nothing here uses an input either one moved.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The boundary between what ships publicly and what does not.
      # Runs first: a leaked secret is worse than a failing test.
      - name: Guard
        run: node scripts/guard-commit.mjs --all

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs in workerd with a real D1 binding, not a Node emulation. The floor
      # wrapper refuses a run whose file count shrank: vitest once summarised a
      # suite as green while two files never executed, and the denominator
      # followed the numerator so the line looked fine.
      - name: Test
        run: npm run test:floor

      # `build:cli` runs the Worker build first, then builds both binaries and runs
      # each one. Publishing is a real workflow now, so what CI checks is what gets
      # published rather than only what compiles.
      - name: Build
        run: npm run build:cli

      # The tarball, not the working tree. The first publish attempt shipped neither
      # a Worker nor a usable bin field, and nothing in this file would have noticed:
      # both were correct on disk and wrong in the package.
      - name: Package
        run: npm run check:package

  # The site is its own workspace with its own runner. Until this job existed it
  # was green only because somebody ran it by hand on one machine.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      # Lint ran nowhere until this step existed, so two errors sat in the tree for
      # days: one the handover called deliberate without saying so anywhere the
      # linter could read, and one that arrived with the row editor and was never
      # declared at all. Both now carry their reason in the file, which is the thing
      # a suppression is for.
      - name: Lint
        run: npm run lint
        working-directory: site

      # `npm test` there is a production build plus the rendered-HTML contract
      # tests, so what CI checks is what deploys rather than only what compiles.
      - name: Build and contract tests
        run: npm test
        working-directory: site

  # Asks about production rather than about this commit: is the site that is
  # deployed right now calling a bridge route that npm does not serve?
  #
  # `deploy:site` already refuses that combination, but a gate only guards the path
  # it sits on, and deploying with `wrangler` by hand skips it. AGENTS.md section 8
  # has been broken four times and the fourth was live for a day before anybody
  # looked, so the durable check is on the state, not on the procedure.
  #
  # main only, and not on pull requests. A branch that adds a call to a route which
  # is not published yet is correct work in the right order: publish comes between
  # merge and deploy, so failing the PR would push people to bypass this rather
  # than to follow it. Production is the only place the combination is wrong.
  ship-order:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No `npm ci`. This reads a deployed site and a published tarball, and needs
      # neither this repository's dependencies nor its build.
      - name: Deployed site against the published CLI
        run: node scripts/check-ship-order.mjs --live
